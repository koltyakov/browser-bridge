interface:
  display_name: 'Browser Bridge'
  short_description: 'Token-efficient Chrome tab inspection, interaction, and patching via local bridge'
  default_prompt: 'Use the browser-bridge skill for Chrome tab inspection, interaction, and patching. Start with `bbx status` to confirm connectivity; if the daemon is offline, run `bbx restart`. If ACCESS_DENIED, ask the user to click Enable in the extension popup/side panel, then retry. The first page call binds to a working tab; keep using it when the user switches tabs. Use `--tab` to target another tab without activating it. Check active state before switching: you may activate tabs you opened for this task while the active tab is also in use for this task. Otherwise, get user permission before taking focus, including when background work requires activation. Prefer structured reads (`dom.query`, `styles.get_computed`) over screenshots. Batch independent reads with `bbx batch`. Use `bbx skill` for runtime presets.'
