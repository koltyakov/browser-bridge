name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Show publish tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: make deps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release version from Git tag
        run: make sync-version generate-protocol

      - name: Check release metadata and generated protocol
        run: make check-release-version check-protocol

      - name: Test Go runtime
        run: make test-go vet-go check-go-format

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test-js

      - name: Review lowest coverage files
        run: make coverage-review

      - name: Check coverage threshold
        run: make coverage-check

      - name: Package extension
        run: make package-extension

      - name: Validate extension ZIP contents
        run: make check-extension-zip

      # Native tests can replace the size report with a host-only build.
      - name: Build all native release assets
        run: make package-native-all

      - name: Publish immutable native assets to GitHub
        run: make publish-native
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pack dry-run
        run: make pack-dry-run

      - name: Create npm tarball
        run: make pack

      - name: Publish npm package
        run: make publish-npm

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.ref_name }}
          path: ./*.tgz
          if-no-files-found: error

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-bridge-extension-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
