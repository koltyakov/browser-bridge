name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      initialize_feed:
        description: 'One-time feed initialization. Run on the first release tag, not a branch.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    concurrency: native-release-publishing
    env:
      RELEASE_SIGNING_PUBLIC_KEYS: ${{ vars.RELEASE_SIGNING_PUBLIC_KEYS }}
      RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
      UPDATE_FEED_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_feed && '--initialize' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Run this workflow on a version tag, not a branch."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Show publish tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: make deps

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve release version from Git tag
        run: make sync-version generate-protocol

      - name: Check native update feed configuration before publishing
        run: make check-update-feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          # Detect obsolete bootstrap configuration rather than silently using it.
          RELEASE_FEED_INITIALIZE: ${{ vars.RELEASE_FEED_INITIALIZE }}

      - name: Check release metadata and generated protocol
        run: make check-release-version check-protocol check-readability

      - name: Test Go runtime
        run: make test-go vet-go check-go-format

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test-js

      - name: Review lowest coverage files
        run: make coverage-review

      - name: Check coverage threshold
        run: make coverage-check

      - name: Package extension
        run: make package-extension

      - name: Validate extension ZIP contents
        run: make check-extension-zip

      # Rebuild every target after tests so all release assets use the current source.
      - name: Build all native release assets
        run: make package-native-all

      - name: Check signed feed candidate before publishing assets
        run: make check-update-feed-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}

      - name: Pack dry-run
        run: make pack-dry-run

      - name: Publish immutable native and extension assets to GitHub
        run: make publish-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish signed native update feed
        run: make publish-update-feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}

      - name: Create npm tarball
        run: make pack

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.ref_name }}
          path: ./*.tgz
          if-no-files-found: error

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-bridge-extension-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

  npm:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Resolve release version from Git tag
        run: make sync-version

      - name: Download this run's npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package-${{ github.ref_name }}

      - name: Publish npm package without a release environment
        run: make publish-npm
