name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'protocol/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'docs/**'
      - 'skills/**'
      - 'scripts/**'
      - 'packages/extension/ui/**'
      - 'packages/extension/assets/**'
      - '.github/workflows/*.yml'
  # No paths filter on pull_request: required status checks would stay
  # pending forever on PRs that only touch unmatched files.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tooling:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: make deps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check generated protocol
        run: make check-protocol

      - name: Go tests and vet
        run: make test-go vet-go check-go-format

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test-js

      - name: Review lowest coverage files
        run: make coverage-review

      - name: Check coverage threshold
        run: make coverage-check

      - name: Package extension
        run: make package-extension

      - name: Validate extension ZIP contents
        run: make check-extension-zip

  validate-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node-version: [20, 22, 24]
        include:
          - os: macos-latest
            node-version: 22
          # The Windows leg activates the Named Pipe transport tests that
          # skip on other platforms. Blocking since the daemon pid startup
          # fix (348f655) stabilized the restart test.
          - os: windows-latest
            node-version: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress

      - name: Install dependencies
        run: make deps

      - name: Test
        run: make test-runtime
