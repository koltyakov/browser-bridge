name: Renew native update feed

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-24.04
    concurrency: native-release-publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: make renew-update-feed
        env:
          GH_TOKEN: ${{ github.token }}
          BBX_NATIVE_UPDATE_KEYS: ${{ vars.BBX_NATIVE_UPDATE_KEYS }}
          BBX_NATIVE_UPDATE_PRIVATE_KEY: ${{ secrets.BBX_NATIVE_UPDATE_PRIVATE_KEY }}
